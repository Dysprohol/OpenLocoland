; mods\textures\_README.txt (tools/build.py OWN_README), as in the English pack's comment
[textures_readme]
title=OpenLocoland - saját textúrák (mods\textures)
what=Az ebbe a mappába tett képekkel a pályaszerkesztőben a terepre lehet festeni: a Terepfestés eszköz a sorában a játék textúrái után mutatja őket, a SAJÁT: mögött. Az almappákban lévő képeket nem olvassa be.
formats=Formátumok: PNG, BMP és JPEG (.png, .bmp, .jpg, .jpeg). Más fájlokat, például WebP vagy GIF képeket, kihagy - ezeket mentsd PNG-ként.
size=Méret: 8 x 8-tól 1024 x 1024 pixelig, bármilyen oldalaránnyal; a kép egy pixele a terep egy pixelére kerül (128 x 128 és 256 x 256 között nagyjából a játék léptéke).
laying=A kép úgy, ahogy van, egymás mellé kerül, minden példány egyenesen állva; varratmentes terephez csempézhetőre készült képet használj. Az eszköz sorában minden textúrának két beállítása van: TURN (0, 90, 180 vagy 270 fok, az R és az E billentyűvel is) és LERAKÁS (EGYMÁS MELLÉ, vagy TÜKRÖZVE a nem csempézhető képhez).
transparency=Az átlátszóságot figyelembe veszi (PNG; a BMP-nek és a JPEG-nek nincs): a kép átlátszó részei a terepet úgy hagyják, ahogy volt, a félig átlátszók keverednek vele.
limits=Legfeljebb 32 kép (a fájlnév szerinti első 32) és összesen 4 millió pixel (például négy 1024 x 1024-es); egy fájl legfeljebb 32 MB.
names=A képek fájlnév szerint vannak sorban, és a szerkesztő mindegyiket a fájlja nevén nevezi.
start=A játék ezt a mappát minden indításkor egyszer olvassa be (amikor a szerkesztőnek először kellenek a textúrák): képek hozzáadása vagy módosítása után indítsd újra a játékot.
left_out=Azt a képet, amelyet a játék nem tud felhasználni (sérült, túl kicsi vagy túl nagy, egy a megengedettnél több), kihagyja: az eszköz sora mutatja, hogy KIMARADT: és hány, a játék mappájában a logs\LocoFix.log pedig megmondja, melyik és miért.
maps=Amit festesz, a pálya saját terepképébe kerül, és a pályával együtt mentődik, így a megosztott vagy exportált pálya magával viszi a festett terepet, és semmi sem kell hozzá ebből a mappából. Csak olyan képet használj, amelyhez jogod van - a sajátodat, vagy olyat, amelynek licence megengedi, hogy egy megosztott pályába tedd.
this_file=Ez a fájl a játéké: a telepítő írja, és egy frissítés újraírja. Minden más ebben a mappában a tiéd: egyetlen frissítés sem módosítja és nem törli.

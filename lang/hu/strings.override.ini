AboutTitle=Névjegy
AboutText=OpenLocoland\n\nLocoland (Gromada, 2003) a LocoFix javításaival.\n\nSzerkesztõ mód - a motor üzemmódja a szerzõk térképszerkesztõjéhez:\nFájl > Betöltés (Alt+F3) betölt egy térképet, Fájl > Mentés (Alt+F2)\n.map fájlba menti a térkép aktuális állapotát.\n\nKattintás kijelöli az objektumot, húzás mozgatja; R / E vagy a\ngörgõ forgatja, A a seregét váltja, T a szemafort állítja, Del\ntörli, Ctrl+Z / Ctrl+Y visszavon és újra végrehajt. Az alsó sáv\núj objektumokat helyez le ([ és ] a díszítést választja); Esc vagy\na jobb gomb visszavált a kijelölésre. A Pálya (3) síneket fektet, a\nsáv Egyirányú szakasz eszköze egyirányú szakaszokat jelöl (T jelzõ,\nS szemaforok), a Fájl > Küldetés beállításai a küldetést és szövegeit szerkeszti.\n\nA sáv bal végén lévõ ? és menü gomb: a súgó és e menük\nösszes parancsa; Ctrl+R elindítja vagy megállítja a szintet.

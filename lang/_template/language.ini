[language]
; Language name as shown in the launcher and the installer
name = <Language Name>
; ISO 639-1 code (en, de, pl, cs, sk, fr, it, etc.)
code = <xx>
; Code page for this language (1250 = Central European, 1251 = Cyrillic, 1252 = Western European)
codepage = 1250
; Base language for Steam files that this translation doesn't have (e.g., Czech uses English Steam files)
; Leave empty or same as code if this language has its own Steam depot. A pack with another
; base is a fan translation: marked unofficial in the lists, and built on any captured language
; when its base is not captured - then its texts must be ASCII (every language's fonts draw it)
; and its strings.override.ini must set the keys whose value differs between the languages
; (tools/check_lang.py lists them); needs_base = 1 builds it only on its own base.
base = en

[font]
; Font mapping file for extended characters (see fonts/mapping/<code>.json)
; mapping = czech.json

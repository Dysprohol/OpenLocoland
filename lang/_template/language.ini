[language]
; Language name as shown in the launcher and the installer
name = <Language Name>
; ISO 639-1 code (en, de, pl, cs, sk, fr, it, etc.)
code = <xx>
; Code page for this language (1250 = Central European, 1251 = Cyrillic, 1252 = Western European)
codepage = 1250
; Base language for Steam files that this translation doesn't have (e.g., Czech uses English Steam files)
; Leave empty or same as code if this language has its own Steam depot
base = en

[font]
; Font mapping file for extended characters (see fonts/mapping/<code>.json)
; mapping = czech.json

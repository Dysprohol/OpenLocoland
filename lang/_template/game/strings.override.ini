; ============================================================
; OpenLocoland Game Texts Override - strings.ini
; ============================================================
; This file OVERRIDES keys in the captured strings.ini (from Steam).
; Format: key=value under the section of the key ([strings], [Units], ...); a section the
;   original does not have ([Editor], the map editor's texts) is added at its end
; - Only include keys you want to CHANGE from the Steam original
; - !key=value corrects a value of an edition of the game in the pack's own language, when
;   the pack is built on its capture (docs/TRANSLATING.md); elsewhere such a line is ignored
; - Encoding: the pack's code page (codepage= in language.ini), not UTF-8
; - build.py merges it into the pack's strings.ini (tools/patch_text.py)
; ============================================================

; Example:
; [strings]
; Money=MONEY
; [Editor]
; The editor's menu entries (Menu*): & marks the letter that opens the item with Alt - one per
; entry, no two items of one menu on the same letter -, \t separates the shortcut shown at the
; right (keep it as it is), && writes an ampersand itself.
; MenuLoad=&Load...\tAlt+F3

; Add your overrides below, one per line:
; key=translated text
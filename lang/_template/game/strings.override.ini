; ============================================================
; OpenLocoland Game Texts Override - strings.ini
; ============================================================
; This file OVERRIDES keys in the captured strings.ini (from Steam).
; Format: key = value
; - Keys are numeric IDs as strings (e.g., "251" = "Water Dragon")
; - Only include keys you want to CHANGE from the Steam original
; - Encoding: UTF-8 (save as UTF-8 without BOM)
; - The game reads these via LocoFix (language.cpp) before fallback to strings.ini
; ============================================================

; Example:
; 251 = Water Dragon
; 252 = Fire Dragon

; Add your overrides below, one per line:
; <key> = <translated text>
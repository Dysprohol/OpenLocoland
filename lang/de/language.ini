; mods\textures\_README.txt (tools/build.py OWN_README), as in the English pack's comment
[textures_readme]
title=OpenLocoland - eigene Texturen (mods\textures)
what=Bilder in diesem Ordner können im Karteneditor auf das Gelände gemalt werden: das Werkzeug Gelände bemalen zeigt sie in seiner Zeile nach den Texturen des Spiels, hinter EIGENE:. Bilder in Unterordnern werden nicht gelesen.
formats=Formate: PNG, BMP und JPEG (.png, .bmp, .jpg, .jpeg). Andere Dateien, etwa WebP- oder GIF-Bilder, werden übergangen - speichere sie als PNG.
size=Größe: von 8 x 8 bis 1024 x 1024 Pixel, in jedem Seitenverhältnis; ein Pixel des Bildes kommt auf ein Pixel des Geländes (128 x 128 bis 256 x 256 ist etwa der Maßstab des Spiels).
laying=Ein Bild wird so, wie es ist, nebeneinander gelegt, jede Kopie aufrecht; für ein Gelände ohne Nähte nimm ein kachelbares Bild. Die Zeile des Werkzeugs hat für jede Textur zwei Einstellungen: TURN (0, 90, 180 oder 270 Grad, auch die Tasten R und E) und LEGEN (NEBENEINANDER, oder GESPIEGELT für ein Bild, das nicht kachelbar ist).
transparency=Transparenz wird beachtet (PNG; BMP und JPEG haben keine): durchsichtige Stellen eines Bildes lassen das Gelände, wie es war, halbdurchsichtige mischen sich mit ihm.
limits=Höchstens 32 Bilder (die ersten 32 nach Dateinamen) und zusammen 4 Millionen Pixel (zum Beispiel vier mit 1024 x 1024); eine Datei höchstens 32 MB.
names=Die Bilder sind nach Dateinamen sortiert, und der Editor benennt jedes nach seinem Dateinamen.
start=Das Spiel liest diesen Ordner einmal bei jedem Start (wenn der Editor die Texturen zum ersten Mal braucht): starte das Spiel nach dem Hinzufügen oder Ändern von Bildern neu.
left_out=Ein Bild, das das Spiel nicht nehmen kann (beschädigt, zu klein oder zu groß, eines zu viel), wird ausgelassen: die Zeile des Werkzeugs zeigt AUSGELASSEN: und wie viele, und logs\LocoFix.log im Spielordner nennt es und sagt, warum.
maps=Was du malst, kommt in das eigene Geländebild der Karte und wird mit ihr gespeichert; eine weitergegebene oder exportierte Karte hat das bemalte Gelände also dabei und braucht nichts aus diesem Ordner. Verwende nur Bilder, an denen du die Rechte hast - eigene oder solche, deren Lizenz erlaubt, sie in eine weitergegebene Karte zu setzen.
this_file=Diese Datei gehört zum Spiel: Setup schreibt sie, und eine Aktualisierung schreibt sie neu. Alles andere in diesem Ordner gehört dir: keine Aktualisierung ändert oder entfernt es.

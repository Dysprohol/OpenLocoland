TipRebuildWait=Neubau nach: wie lange nach dem Verlust die Fabrik den neuen Zug beginnt (in Schritten von 10 s)
OpRebuild=Neubau nach Verlust
PlanAfterMade=NACH DEM BAU DES LETZTEN
PlanAfterLost=VERLUST
PlanListRenewEndless=NEUBAU NACH VERLUST, %s DANACH
PlanListRenewTimes=%d INSGESAMT, NEUBAU NACH VERLUST
CtxTarget=ZIEL:
CtxTargetPick=WÄHLEN...
CtxTargetIs=VID %d BEI %d,%d
TipTarget=Ziel: eine Einheit oder ein Gebäude, das der Zug beim Start der Stufe angreift, statt seines anderen Befehls (der Zug des Feindes geht danach an seine KI zum Angriff; die anderen halten)
MsgTargetPick=Ziel: klicke auf die Einheit oder das Gebäude, das der Zug angreift
MsgTargetNone=Ziel: klicke auf eine Einheit oder ein Gebäude einer anderen Armee (ein Geschütz eines Forts)
MsgOrderTarget=Befehle: der Zug greift %s (VID %d) bei %d,%d an
WordTarget=Ziel
CtxStart=BEGINN:
CtxStartNow=SOFORT
CtxStartAfter=NACH %d S
TipStart=Beginn: der Befehl beginnt sofort oder so viele Sekunden nach dem Start der Stufe (in Schritten von 10 s); bis dahin steht der Zug
OpOrderStart=Befehlsbeginn
AiNeutralTrains=NEUTRALE ZÜGE:
AiNeutralHit=BESCHIESST SIE
AiNeutralSpare=NUR WENN GETROFFEN
AiNeutralNote=DIE GESCHÜTZE DES FEINDES ZIELEN AUF NEUTRALE ZÜGE
TipArrWho=Wer: wessen Zug kommt - unserer, der des Feindes, der Neutralen oder der Piraten
TipArrEntry=Einfahrt: der Gleispunkt, auf dem der Zug entsteht - hinter dem Kartenrand, von wo eine schiebende Strecke ihn hereinbringt
TipArrWhen=Wann: die erste Welle - beim Start, nach einer Zeit, wenn der Spieler keinen Zug hat oder zahlt
TipArrRepeat=Wieder: wie viele Wellen kommen und wie lange nach der vorigen
TipArrThen=Dann: was der Zug tut, sobald er da ist (der des Feindes: die Aufgabe seiner KI)
TipArrPoint=Punkt: der Gleispunkt seiner Aufgabe - WÄHLEN, dann ein Klick aufs Gleis
TipArrPoints=Punkte: die zwei Enden seiner Patrouille - WÄHLEN, dann zwei Klicks aufs Gleis
TipPlanTrain=Zug: was die Fabrik baut, nach seinen Wagen (unsere, der Neutralen und der Piraten mit dem Preis)
TipArrCars=Wagen: der Zug in seiner Folge - ein Klick wählt einen Wagen (< > verschieben, ENTFERNEN); gehalten öffnen ein Wagen oder + WAGEN die Einheiten: auf einer loslassen setzt sie dorthin oder fügt sie an
TipHoldUnit=%s (VID %d): loslassen setzt ihn hierher
TipCtxArmy=Armee: wem es gehört - uns, dem Feind, den Neutralen oder den Piraten (A)
TipCtxFight=Im Kampf: gegen wen es nach den Regeln der Karte kämpft
TipCtxFires=Schießt: ob seine Geschütze von selbst feuern
TipCtxTrain=Zug: wenden (R), nur diesen Wagen drehen (E), an den Zug auf dem Gleis ankuppeln (C)
TipCtxUncouple=Abkuppeln: vor diesem Wagen (U - er und die Wagen hinter ihm sind ein neuer Zug) oder hinter ihm (Shift+U - die Wagen hinter ihm); nichts bewegt sich
TipCtxDelete=Löschen: dieses Objekt (Entf) - ein Wagen oder sein ganzer Zug (Umschalt+Entf)
TipCtxTurn=Drehen: R / E oder das Mausrad
TipCtxPostFor=Für Züge: die Richtung der Züge, für die das Signal gilt - die andere dreht es um
TipCtxColour=Farbe: Rot hält seine Züge an, Grün lässt sie herein (T)
TipCtxLine=Strecke: die eigene Einbahnstrecke des Signals - was sie seinen Zügen tut (L / Umschalt+L)
TipCtxLineAction=Wirkung: schiebt die Züge entlang oder verbietet nur die Gegenrichtung (T)
TipCtxLineWay=Richtung: wohin die Strecke läuft - R dreht sie um
TipCtxHeight=Höhe: über dem Boden (Bild auf / Bild ab, Pos1: auf dem Boden)
PlanNext=NÄCHSTER:
TipPlanNext=Nächster: die Zeit von ALLE zählt ab dem Bau des letzten Zuges oder ab seinem Verlust (Lok zerstört oder erbeutet)
CtxFights=KAMPF:
CtxOrderArea=GEBIET...
CtxArea=GEBIET:
CtxAreaRadius=%d PX
CtxAreaReturns=KEHRT ZURÜCK
CtxAreaChases=VERFOLGT
TipArea=Gebiet: das Gebiet, das der Zug von seinem Platz aus bewacht (Radius in Schritten von 50 px); KEHRT ZURÜCK - an seinen Platz, wenn das Ziel weg ist oder 240 px aus dem Gebiet, VERFOLGT - dem Ziel nach, wohin es auch fährt, an seinen Platz zurück, wenn es weg ist
TipFightsEnemy=Kampf: ANGRIFF und BEWACHEN geben den Zug der KI des Feindes (sie greift den Spieler an / hält den Punkt); GEBIET: er bleibt stehen, nimmt einen feindlichen Zug im oder am Gebiet und kehrt an seinen Platz zurück
TipFightsOwn=Kampf: ANGRIFF jagt den nächsten feindlichen Zug, einen nach dem anderen; BEWACHEN fährt zum Punkt und hält ihn (150 px); GEBIET: bleibt stehen und verteidigt ein eigenes Gebiet, irgendwo auf der Karte
OpOrderArea=Befehlsgebiet
WordArea=Gebiet
MsgOrderGuardOwn=Befehle: der Zug bewacht %d,%d - er nimmt einen feindlichen Zug in 150 px und kehrt zurück
MsgOrderHunt=Befehle: der Zug jagt den nächsten feindlichen Zug, einen nach dem anderen
MsgOrderArea=Befehle: der Zug bleibt stehen und verteidigt das Gebiet von %d px um %d,%d
CtxFightAnswers=NUR GEGEN ANGREIFER
CtxFightAll=ALLE SEITEN
TipFightNeutral=Im Kampf: die Neutralen antworten nur ihren Angreifern (Vorgabe) oder kämpfen gegen alle und alle gegen sie - eine Regel für alle Neutralen der Karte
TipFightPirates=Im Kampf: die Piraten kämpfen gegen alle (Vorgabe) oder antworten nur ihren Angreifern - eine Regel für alle Piraten der Karte
MsgFightAnswers=im Kampf: Armee %d (%s) antwortet nur ihren Angreifern
MsgFightAll=im Kampf: Armee %d (%s) kämpft gegen alle und alle gegen sie
OpFight=Kampfregel
CtxFiresOwn=VON SELBST
CtxFiresTold=NUR AUF BEFEHL
TipFiresOwn=Schießt: von selbst auf das, was in Reichweite kommt, oder nur auf das, was es angreifen soll
CtxRedPassOurs=FÄHRT (ALLE UNSEREN)
CtxRedPassEnemy=FÄHRT (ALLE FEINDE)
TipRedArmy=Bei Rot: ob die Züge dieser Armee vor einer Einbahnstrecke gegen ihre Richtung halten, wie jeder Zug, oder auf ihr weiterfahren - eine Regel für alle Züge der Armee

AboutTitle=Info
AboutText=OpenLocoland\n\nLocoland (Gromada, 2003) mit den LocoFix-Korrekturen.\n\nEditormodus - der Modus der Engine für den Karteneditor der Autoren:\nDatei > Laden (Alt+F3) lädt eine Karte, Datei > Speichern (Alt+F2) speichert\nden aktuellen Stand der Karte als .map-Datei.\n\nObjekt anklicken, um es zu wählen, ziehen, um es zu verschieben; R / E oder\ndas Mausrad drehen es, A wechselt die Armee, T schaltet ein Signal, Del\nentfernt es, Ctrl+Z / Ctrl+Y machen rückgängig und wiederholen. Die Leiste unten\nsetzt neue Objekte ([ und ] wählen die Dekoration); Esc oder die rechte\nMaustaste kehren zum Auswählen zurück. Gleis (3) verlegt Schienen, das Werkzeug\nEinbahnstrecke der Leiste markiert Einbahnstrecken (T Schub, S Signale),\nDatei > Missionseinstellungen bearbeitet die Mission und ihre Texte.\n\nDas ? und die Menütaste am linken Ende der Leiste: die Hilfe\nund alle Befehle dieser Menüs; Ctrl+R startet oder hält das Level an.

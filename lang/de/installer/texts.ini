; ============================================================
; OpenLocoland Installer UI Texts
; ============================================================
; Translate the VALUES (right side of =) only.
; Keep the KEYS (left side) exactly as they are.
; Placeholders like {version}, {path}, {files} must be preserved.
; Newlines in source are \n - keep them or use actual newlines in editor.
; Encoding: UTF-8 (save as UTF-8 without BOM)
; ============================================================

[metadata]
; Language name (shown in language selector)
name = <Language Name>

[window]
title = OpenLocoland {version} - setup
intro = OpenLocoland is built from your own Steam copy of Locoland into a folder of its own. The Steam game is only read and stays as it is.

[labels]
language = Language:
steam = Locoland in Steam:
target = Install into:
browse = Browse...
game_language = Game language:
more_languages = Other languages: see the note below.

[depots]
depots = The game's other languages come from Steam: open the Steam console (type steam://open/console into the browser's address bar or Win+R), enter the line of each language you want, wait until Steam has downloaded it and run Setup again:
depots_local = The game's other languages are not found (no Steam depots in skip-verify mode):
no_language = No language of the game can be built - is Locoland installed through Steam?

[options]
options = Options (they can be changed later in the game's launcher window)
cheats = Cheats (developer keys: h, W, B, A, K, M, #, x)
unlock = All missions unlocked (your progress stays as it is)
skip_verify = Skip version verification (for CD/beta-demo exes; patches may break)

[shortcuts]
shortcuts = Shortcuts
desktop = On the desktop
start_menu = In the Start menu

[buttons]
install = Install
update = Update
uninstall = Uninstall
run = Play
close = Close
github = GitHub

[errors]
no_steam = Locoland was not found in Steam. Install it through Steam or choose its folder (the one with Steam.exe).
bad_steam = This folder has no Locoland from Steam (Steam.exe is missing):\n{path}
inside_steam = The install folder must not be the Steam folder of the game or inside it.
modified_steam = Steam.exe in this folder is not the original file of the game - it was changed or replaced (e.g. by a resolution fix):\n{path}\n\nRestore the original in Steam: right-click Locoland > Properties > Installed Files > Verify integrity of game files. Then run Setup again.
modified_files = Your Locoland files in Steam are modified ({files}):\n{path}\n\nRestore them in Steam: right-click Locoland > Properties > Installed Files > Verify integrity of game files. Then run Setup again. OpenLocoland has its own option for the developer keys: Cheats, below.
not_empty = The folder is not empty and has no OpenLocoland install:\n{path}\n\nInstall there anyway? Its other files are left alone.
running = OpenLocoland is running from this folder. Close the game first.

[status]
working = Installing...
done = Done. OpenLocoland {version} is in {path}
failed = Installation failed: {error}

[uninstall]
uninstall_ask = Remove OpenLocoland from\n{path}?\n\nThe folder is deleted with everything in it (also maps made in the editor and the high scores), with the shortcuts and the language files kept in {captured}.\nYour profiles, progress and settings in the registry stay (the Steam game uses them too).
uninstalled = OpenLocoland was removed from {path}

[shortcut_names]
; These are the names of the shortcuts created on Desktop/Start Menu
game_name = Locoland
editor_name = Locoland - map editor
editor_desc = The map editor of OpenLocoland
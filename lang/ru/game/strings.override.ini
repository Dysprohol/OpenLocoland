TipArea=Зона: зона, которую поезд охраняет со своего места (радиус, шаг 50 пкс); ВОЗВРАЩАЕТСЯ - на свое место, когда цель уничтожена или ушла на 240 пкс за зону, ПРЕСЛЕДУЕТ - за целью куда угодно, назад на свое место, когда она уничтожена
TipFightsEnemy=Бой: АТАКА и ОХРАНА отдают поезд ИИ врага (атакует игрока / держит точку); ЗОНА: стоит на месте, берет враждебный поезд в зоне или у нее и возвращается на свое место
TipFightsOwn=Бой: АТАКА охотится на ближайший враждебный поезд, один за другим; ОХРАНА едет на точку и держит ее (150 пкс); ЗОНА: стоит на месте и защищает свою зону в любом месте карты
OpOrderArea=зона приказа
WordArea=зона
MsgOrderGuardOwn=приказы: поезд охраняет %d,%d - берет враждебный поезд в 150 пкс и возвращается
MsgOrderHunt=приказы: поезд охотится на ближайший враждебный поезд, один за другим
MsgOrderArea=приказы: поезд стоит на месте и защищает зону %d пкс вокруг %d,%d
CtxFightAnswers=ОТВЕЧАЕТ НАПАДАЮЩИМ
CtxFightAll=ВСЕ СТОРОНЫ
TipFightNeutral=В бою: нейтралы отвечают только нападающим (по умолчанию) или воюют со всеми, и все с ними - одно правило для всех нейтралов карты
TipFightPirates=В бою: пираты воюют со всеми (по умолчанию) или отвечают только нападающим - одно правило для всех пиратов карты
MsgFightAnswers=в бою: армия %d (%s) отвечает только нападающим
MsgFightAll=в бою: армия %d (%s) воюет со всеми, и все с ней
OpFight=правило боя
CtxFiresOwn=САМ
CtxFiresTold=ПО ПРИКАЗУ
TipFiresOwn=Стреляет: сам по тому, что входит в радиус, или только по тому, что ему приказано атаковать
CtxRedPassOurs=ЕДЕТ (ВСЕ НАШИ)
CtxRedPassEnemy=ЕДЕТ (ВСЕ ВРАГА)
TipRedArmy=На красный: останавливаются ли поезда этой армии перед односторонней линией против ее хода, как любой поезд, или едут дальше - одно правило для всех поездов армии

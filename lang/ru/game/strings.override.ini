AboutTitle=О редакторе
AboutText=OpenLocoland\n\nLocoland (Gromada, 2003) с исправлениями LocoFix.\n\nРежим редактора - режим движка для редактора карт авторов игры:\nФайл > Загрузить (Alt+F3) загружает карту, Файл > Сохранить\n(Alt+F2) сохраняет текущее состояние карты в файл .map.\n\nЩелчок выделяет объект, перетаскивание двигает его; R / E или\nколесо поворачивают его, A меняет армию, T переключает семафор,\nDel удаляет, Ctrl+Z / Ctrl+Y отменяют и повторяют. Панель внизу\nставит новые объекты ([ и ] выбирают декорацию); Esc или правая\nкнопка возвращают к выделению. Пути (3) кладут рельсы, инструмент\nОдносторонний участок отмечает такие участки (T флаг, S семафоры),\nФайл > Настройки миссии меняет миссию и ее тексты.\n\nКнопки ? и меню слева на панели: справка и все команды\nэтих меню; Ctrl+R запускает или останавливает уровень.

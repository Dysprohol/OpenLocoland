; mods\textures\_README.txt (tools/build.py OWN_README), as in the English pack's comment
[textures_readme]
title=OpenLocoland - свои текстуры (mods\textures)
what=Картинками из этой папки можно раскрашивать местность в редакторе карт: инструмент Покраска местности показывает их в своём ряду после текстур игры, за СВОИ:. Картинки во вложенных папках не читаются.
formats=Форматы: PNG, BMP и JPEG (.png, .bmp, .jpg, .jpeg). Другие файлы, например картинки WebP или GIF, пропускаются - сохраните их как PNG.
size=Размер: от 8 x 8 до 1024 x 1024 пикселей, с любыми пропорциями; пиксель картинки ложится на пиксель местности (от 128 x 128 до 256 x 256 - примерно масштаб игры).
laying=Картинка кладётся рядом сама с собой как есть, каждая копия прямо; для местности без швов берите картинку, сделанную для бесшовного повторения. В ряду инструмента у каждой текстуры две настройки: TURN (0, 90, 180 или 270 градусов, также клавиши R и E) и УКЛАДКА (РЯДОМ или ЗЕРКАЛЬНО - для картинки, которая не повторяется без швов).
transparency=Прозрачность учитывается (PNG; у BMP и JPEG её нет): прозрачные части картинки оставляют местность как была, полупрозрачные смешиваются с ней.
limits=Не больше 32 картинок (берутся первые 32 по имени файла) и всего 4 миллиона пикселей (например, четыре по 1024 x 1024); один файл не больше 32 МБ.
names=Картинки упорядочены по именам файлов, и редактор называет каждую именем её файла.
start=Игра читает эту папку один раз при каждом запуске (когда редактору впервые нужны текстуры): после добавления или изменения картинок перезапустите игру.
left_out=Картинка, которую игра не может взять (повреждённая, слишком маленькая или большая, лишняя), пропускается: ряд инструмента показывает ПРОПУЩЕНО: и сколько, а logs\LocoFix.log в папке игры говорит, какая и почему.
maps=То, что вы нарисуете, попадает в собственную картинку местности карты и сохраняется вместе с картой, поэтому переданная или экспортированная карта несёт раскрашенную местность с собой и не нуждается ни в чём из этой папки. Используйте только картинки, на которые у вас есть права, - свои или такие, лицензия которых разрешает поместить их в карту, которой вы делитесь.
this_file=Этот файл принадлежит игре: его пишет установщик, а обновление пишет его заново. Всё остальное в этой папке ваше: никакое обновление этого не меняет и не удаляет.

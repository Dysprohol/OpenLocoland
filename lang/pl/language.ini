; mods\textures\_README.txt (tools/build.py OWN_README), as in the English pack's comment
[textures_readme]
title=OpenLocoland - wlasne tekstury (mods\textures)
what=Obrazki wlozone do tego folderu mozna malowac na terenie w edytorze map: narzedzie Malowanie terenu pokazuje je w swoim rzedzie po teksturach gry, za WLASNE:. Obrazki w podfolderach nie sa czytane.
formats=Formaty: PNG, BMP i JPEG (.png, .bmp, .jpg, .jpeg). Inne pliki, na przyklad obrazki WebP albo GIF, sa pomijane - zapisz je jako PNG.
size=Rozmiar: od 8 x 8 do 1024 x 1024 pikseli, w dowolnych proporcjach; piksel obrazka idzie na piksel terenu (128 x 128 do 256 x 256 to mniej wiecej skala gry).
laying=Obrazek kladzie sie obok siebie taki, jaki jest, kazda kopia prosto; zeby teren nie mial szwow, uzyj obrazka zrobionego do kafelkowania. Rzad narzedzia ma dla kazdej tekstury dwa ustawienia: OBROT (0, 90, 180 albo 270 stopni, takze klawisze R i E) i UKLADANIE (OBOK SIEBIE albo LUSTRZANIE - dla obrazka, ktory sie nie kafelkuje).
transparency=Przezroczystosc jest uwzgledniana (PNG; BMP i JPEG jej nie maja): przezroczyste czesci obrazka zostawiaja teren taki, jaki byl, polprzezroczyste mieszaja sie z nim.
limits=Najwyzej 32 obrazki (brane sa pierwsze 32 wedlug nazw plikow) i razem 4 miliony pikseli (na przyklad cztery po 1024 x 1024); jeden plik najwyzej 32 MB.
names=Obrazki sa ulozone wedlug nazw plikow, a edytor nazywa kazdy nazwa jego pliku.
start=Gra czyta ten folder raz przy kazdym uruchomieniu (gdy edytor pierwszy raz potrzebuje tekstur): po dodaniu albo zmianie obrazkow uruchom gre ponownie.
left_out=Obrazek, ktorego gra nie moze wziac (uszkodzony, za maly albo za duzy, o jeden za duzo), jest pomijany: rzad narzedzia pokazuje POMINIETE: i ile, a logs\LocoFix.log w folderze gry mowi, ktory i dlaczego.
maps=To, co namalujesz, trafia do obrazu terenu samej mapy i zapisuje sie razem z nia, wiec udostepniona albo wyeksportowana mapa ma namalowany teren ze soba i nie potrzebuje niczego z tego folderu. Uzywaj tylko obrazkow, do ktorych masz prawo - wlasnych albo takich, ktorych licencja pozwala umiescic je w mapie, ktora udostepniasz.
this_file=Ten plik nalezy do gry: zapisuje go instalator, a aktualizacja zapisuje go od nowa. Wszystko inne w tym folderze jest twoje: zadna aktualizacja tego nie zmienia ani nie usuwa.

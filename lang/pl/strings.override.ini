AboutTitle=O edytorze
AboutText=OpenLocoland\n\nLocoland (Gromada, 2003) z poprawkami LocoFix.\n\nTryb edytora - tryb silnika gry dla edytora map jej autorow:\nPlik > Wczytaj (Alt+F3) wczytuje mape, Plik > Zapisz (Alt+F2)\nzapisuje obecny stan mapy jako plik .map.\n\nKlikniecie zaznacza obiekt, przeciagniecie go przesuwa; R / E lub\nkolko myszy go obracaja, A zmienia jego armie, T przelacza semafor,\nDel usuwa, Ctrl+Z / Ctrl+Y cofaja i ponawiaja. Pasek na dole\nstawia nowe obiekty ([ i ] wybieraja dekoracje); Esc lub prawy\nprzycisk wracaja do zaznaczania. Tory (3) ukladaja szyny, narzedzie\nLinia jednokierunkowa z paska oznacza linie jednokierunkowe\n(T kierunek pchania, S semafory), Plik > Ustawienia misji zmienia\nmisje i jej teksty.\n\nPrzyciski ? i menu na lewym koncu paska: pomoc i wszystkie\npolecenia tych menu; Ctrl+R uruchamia lub wstrzymuje poziom.

; Language pack description (UTF-8). The launcher lists every folder in lang\ that has
; this file; [launcher] holds the launcher labels in this language.
; Czech: a fan translation (unofficial) on the English game files - Steam has no Czech
; version, so the pack is the English capture (base) with these texts over it - or, without an
; English capture, another captured language (tools/languages.py build_base). The fonts have
; no Czech letters, so the game texts are written without diacritics (ASCII, which every
; language's fonts draw).
[language]
name=Čeština
; the code page of the pack's texts (strings.ini, the maps' texts, the fonts' characters)
codepage=1250
; the captured language the pack is built on (another one when it is not captured, unless
; needs_base=1: the pack uses letters or files only that language has)
base=en

[launcher]
full_screen=Celá obrazovka
cancel=Zrušit
language=Jazyk:
fps_counter=Počítadlo FPS
frame_limit=Limit FPS:
cheats=Cheaty
all_missions=Všechny mise
; after the name of a fan translation (base= another language) in the language list
unofficial=(neoficiální)

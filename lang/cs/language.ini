; Language pack description (UTF-8). The launcher lists every folder in lang\ that has
; this file; [launcher] holds the launcher labels in this language.
; Czech: Steam has no Czech version. With the Czech edition of the game at hand (sold on CD as
; "Steamland"; build.py captures it as cs, tools/languages.py EDITIONS) the pack is that
; capture - its texts and fonts - with only this pack's own additions over it. Without it the
; pack is a fan translation (unofficial) on the English capture (base) - or, without that,
; another captured language (languages.build_base) - with these texts over it and the Czech
; letters of fonts/*.png pasted into the base's fonts (tools/font_cells.py). The texts are
; CP1250 with diacritics.
[language]
name=Čeština
; the code page of the pack's texts (strings.ini, the maps' texts, the fonts' characters)
codepage=1250
; the captured language the pack is built on when its own (cs, the Czech edition) is not
; captured (another one when this is not captured either, unless needs_base=1: the pack uses
; letters or files only that language has); build.py writes the capture built on here
base=en

[launcher]
full_screen=Celá obrazovka
cancel=Zrušit
language=Jazyk:
fps_counter=Zobrazit FPS
frame_limit=Limit FPS:
cheats=Cheaty
all_missions=Všechny mise
; after the name of a fan translation (base= another language) in the language list
unofficial=(neoficiální)
; the launcher's update check (src/LocoFix/update_check.cpp): %1 and %2 are filled in - a version,
; a date, a size in MB or a file name; the notice when GitHub cannot be reached is in update.txt
check_updates=Zkontrolovat aktualizace
check_at_start=Při spuštění
update_checking=Kontrola aktualizací...
update_current=Máte nejnovější verzi (%1).
update_new=Je k dispozici nová verze %1 (máte %2).
update_dev=Nejnovější verze je %1 (toto sestavení: %2).
update_last=Poslední kontrola %1: nejnovější byla verze %2.
update_download=Stáhnout
update_downloading=Stahování instalátoru: %1 z %2 MB...
update_downloaded=Uloženo do složky Stažené soubory: %1
update_run=Spustit Setup
update_run_question=Instalátor se nyní spustí a hra se zavře, aby ji mohl aktualizovat. Vaše mapy, skóre a postup zůstanou. Pokračovat?
update_failed=Stažení se nezdařilo. Odkaz GitHub otevře stránku vydání.
update_offline_start=Bez připojení - kontrola při spuštění vynechána; políčko vedle ji vypne.
open_link=Otevřít v prohlížeči
copy_link=Kopírovat adresu

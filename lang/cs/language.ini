; Language pack description (UTF-8). The launcher lists every folder in lang\ that has
; this file; [launcher] holds the launcher labels in this language.
; Czech: Steam has no Czech version. With the Czech edition of the game at hand (sold on CD as
; "Steamland"; build.py captures it as cs, tools/languages.py EDITIONS) the pack is that
; capture - its texts and fonts - with only this pack's own additions over it. Without it the
; pack is a fan translation (unofficial) on the English capture (base) - or, without that,
; another captured language (languages.build_base) - with these texts over it and the Czech
; letters of fonts/*.png pasted into the base's fonts (tools/font_cells.py). The texts are
; CP1250 with diacritics.
[language]
name=Čeština
; the code page of the pack's texts (strings.ini, the maps' texts, the fonts' characters)
codepage=1250
; the captured language the pack is built on when its own (cs, the Czech edition) is not
; captured (another one when this is not captured either, unless needs_base=1: the pack uses
; letters or files only that language has); build.py writes the capture built on here
base=en

[launcher]
full_screen=Celá obrazovka
cancel=Zrušit
language=Jazyk:
fps_counter=Zobrazit FPS
frame_limit=Limit FPS:
cheats=Cheaty
all_missions=Všechny mise
; after the name of a fan translation (base= another language) in the language list
unofficial=(neoficiální)
; the launcher's update check (src/LocoFix/update_check.cpp): %1 and %2 are filled in - a version,
; a date, a size in MB or a file name; the notice when GitHub cannot be reached is in update.txt
check_updates=Zkontrolovat aktualizace
check_at_start=Při spuštění
; a box under the button: the check also offers releases marked as pre-releases (test versions)
check_prereleases=Včetně testovacích verzí
update_checking=Kontrola aktualizací...
update_current=Máte nejnovější verzi (%1).
update_new=Je k dispozici nová verze %1 (máte %2).
; the version found, when it is a pre-release (in update_new and update_dev)
update_prerelease=%1 (testovací verze)
update_dev=Nejnovější verze je %1 (toto sestavení: %2).
update_last=Poslední kontrola %1: nejnovější byla verze %2.
update_download=Stáhnout
update_downloading=Stahování instalátoru: %1 z %2 MB...
update_downloaded=Uloženo do složky Stažené soubory: %1
update_run=Spustit Setup
update_run_question=Instalátor se nyní spustí a hra se zavře, aby ji mohl aktualizovat. Vaše mapy, skóre a postup zůstanou. Pokračovat?
update_failed=Stažení se nezdařilo. Odkaz GitHub otevře stránku vydání.
update_offline_start=Bez připojení - kontrola při spuštění vynechána; políčko vedle ji vypne.
open_link=Otevřít v prohlížeči
copy_link=Kopírovat adresu

; mods\textures\_README.txt (tools/build.py OWN_README), as in the English pack's comment
[textures_readme]
title=OpenLocoland - vlastní textury (mods\textures)
what=Obrázky vložené do této složky lze v editoru map malovat na terén: nástroj Malovat terén je ukazuje ve svém řádku za texturami hry, za VLASTNÍ:. Obrázky v podsložkách se nečtou.
formats=Formáty: PNG, BMP a JPEG (.png, .bmp, .jpg, .jpeg). Jiné soubory, například obrázky WebP nebo GIF, se přeskakují - uložte je jako PNG.
size=Velikost: od 8 x 8 do 1024 x 1024 pixelů, v libovolném poměru stran; pixel obrázku jde na pixel terénu (128 x 128 až 256 x 256 je zhruba měřítko hry).
laying=Obrázek se klade vedle sebe tak, jak je, každá kopie rovně; pro terén bez švů použijte obrázek udělaný pro skládání vedle sebe. Řádek nástroje má pro každou texturu dvě nastavení: TURN (0, 90, 180 nebo 270 stupňů, také klávesy R a E) a KLADENÍ (VEDLE SEBE, nebo ZRCADLENĚ pro obrázek, který na sebe nenavazuje).
transparency=Průhlednost se respektuje (PNG; BMP a JPEG ji nemají): průhledné části obrázku nechají terén, jaký byl, poloprůhledné se s ním smíchají.
limits=Nejvýše 32 obrázků (berou se prvních 32 podle názvu souboru) a dohromady 4 miliony pixelů (například čtyři po 1024 x 1024); jeden soubor nejvýše 32 MB.
names=Obrázky jsou seřazeny podle názvů souborů a editor každý pojmenuje názvem jeho souboru.
start=Hra čte tuto složku jednou při každém spuštění (když editor poprvé potřebuje textury): po přidání nebo změně obrázků hru spusťte znovu.
left_out=Obrázek, který hra nemůže vzít (poškozený, příliš malý nebo velký, o jeden navíc), se vynechá: řádek nástroje ukazuje VYNECHÁNO: a kolik, a logs\LocoFix.log ve složce hry uvádí, který a proč.
maps=Co namalujete, se uloží do vlastního obrázku terénu mapy spolu s mapou, takže sdílená nebo exportovaná mapa má namalovaný terén s sebou a nepotřebuje nic z této složky. Používejte jen obrázky, k nimž máte práva - vlastní, nebo takové, jejichž licence dovoluje dát je do mapy, kterou sdílíte.
this_file=Tento soubor patří hře: zapisuje ho instalátor a aktualizace ho zapíše znovu. Vše ostatní v této složce je vaše: žádná aktualizace to nezmění ani neodstraní.

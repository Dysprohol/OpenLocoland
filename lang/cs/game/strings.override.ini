AboutTitle=O programu
AboutText=OpenLocoland\n\nLocoland (Gromada, 2003) s opravami LocoFix.\n\nRežim editoru - režim enginu pro editor map autora hry:\nSoubor > Načíst (Alt+F3) načte mapu, Soubor > Uložit (Alt+F2) uloží\naktualní stav mapy jako soubor .map.\n\nKliknutím objekt vyberete, tažením ho přesunete; R / E nebo\nkolečko ho otačí, A mění jeho armádu, T přepíná návěstidlo, Del\nho odstraní, Ctrl+Z / Ctrl+Y zpět a znovu. Lišta dole\numisťuje nové objekty ([ a ] vybíra dekoraci); Esc nebo pravé\ntlačítko vrací k výběru. Trať (3) pokládá koleje, nástroj\nJednosměrný úsek na lište označuje jednosměrné úseky (T funkce, S návěstidla),\nSoubor > Nastavení mise upravuje misi a její texty.\n\n? a tlačítko nabídky na levém konci lišty: nápověda\na všechny příkazy těchto nabídek; Ctrl+R spustí nebo zastaví úroveň.

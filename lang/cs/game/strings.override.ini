AboutTitle=O programu
AboutText=OpenLocoland\n\nLocoland (Gromada, 2003) s opravami LocoFix.\n\nRezim editoru - rezim enginu pro editor map autoru hry:\nSoubor > Nacist (Alt+F3) nacte mapu, Soubor > Ulozit (Alt+F2) ulozi\naktualni stav mapy jako soubor .map.\n\nKliknutim objekt vyberete, tazenim ho presunete; R / E nebo\nkolecko ho otaci, A meni jeho armadu, T prepina navestidlo, Del\nho odstrani, Ctrl+Z / Ctrl+Y zpet a znovu. Lista dole\numistuje nove objekty ([ a ] vybira dekoraci); Esc nebo prave\ntlacitko vraci k vyberu. Trat (3) poklada koleje, nastroj\nJednosmerny usek na liste oznacuje jednosmerne useky (T priznak, S navestidla),\nSoubor > Nastaveni mise upravuje misi a jeji texty.\n\n? a tlacitko nabidky na levem konci listy: napoveda\na vsechny prikazy techto nabidek; Ctrl+R spusti nebo zastavi uroven.

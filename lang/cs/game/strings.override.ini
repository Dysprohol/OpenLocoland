; the edition as cs - DEVELOPERS.md "Czech") the edition's texts stay: this file then fills only
; the keys the edition lacks or leaves empty - ours and the editor's - and the lines marked !
; correct the edition's own slips (notes/czech-edition.md; syntax in tools/patch_text.py).


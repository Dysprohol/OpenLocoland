; mods\textures\_README.txt, the note in the folder of the player's own textures (tools/build.py
; OWN_README): written in the installed pack's language and code page, one paragraph a key in this
; order, wrapped at 78 columns; a pack without the section gets the English note
[textures_readme]
title=OpenLocoland - your own textures (mods\textures)
what=Pictures put into this folder can be painted on the ground in the map editor: the Paint the ground tool shows them in its row after the game's textures, behind OWN:. Pictures in subfolders are not read.
formats=Formats: PNG, BMP and JPEG (.png, .bmp, .jpg, .jpeg). Other files, such as WebP or GIF pictures, are ignored - save them as PNG.
size=Size: from 8 x 8 to 1024 x 1024 pixels, in any proportions; one pixel of a picture goes on one pixel of the ground (128 x 128 to 256 x 256 is about the game's own scale).
laying=A picture is laid side by side as it is, every copy upright; for a ground without seams use a picture made to tile. The tool's row has two settings for each texture: TURN (0, 90, 180 or 270 degrees, also the keys R and E) and LAYING (SIDE BY SIDE, or MIRRORED for a picture that does not tile).
transparency=Transparency is respected (PNG; BMP and JPEG have none): the transparent parts of a picture leave the ground as it was, half transparent ones blend with it.
limits=At most 32 pictures (the first 32 by file name are used) and 4 million pixels all together (four pictures of 1024 x 1024, for example); one file at most 32 MB.
names=The pictures are sorted by file name, and the editor names each by its file name.
start=The game reads this folder once each time it starts (when the editor first needs its textures): after adding or changing pictures, start the game again.
left_out=A picture the game cannot take (broken, too small or too big, one too many) is left out: the tool's row shows LEFT OUT: and how many, and logs\LocoFix.log in the game folder names it and says why.
maps=What you paint goes into the map's own ground picture and is saved with the map, so a map you share or export carries the painted ground and needs nothing from this folder. Use only pictures you have the right to use - your own, or ones whose licence lets you put them into a map you share.
this_file=This file is the game's: Setup writes it, and an update writes it again. Everything else in this folder is yours: no update changes or removes it.

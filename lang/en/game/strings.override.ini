AboutTitle=About
AboutText=OpenLocoland\n\nLocoland (Gromada, 2003) with the LocoFix fixes.\n\nEditor mode - the engine's mode for the authors' map editor:\nFile > Load (Alt+F3) loads a map, File > Save (Alt+F2) saves the\ncurrent state of the map as a .map file.\n\nClick an object to select it, drag it to move it; R / E or the\nwheel turn it, A changes its army, T switches a semaphore, Del\nremoves it, Ctrl+Z / Ctrl+Y undo and redo. The bar at the bottom\nplaces new objects ([ and ] pick the decal); Esc or the right\nbutton go back to selecting. Track (3) lays rails, the Push line\ntool of the strip marks one-way lines (T flag, S semaphores),\nFile > Mission settings edits the mission and its texts.\n\nThe ? and the menu button at the left end of the bar: the help\nand every command of these menus; Ctrl+R runs or holds the level.
